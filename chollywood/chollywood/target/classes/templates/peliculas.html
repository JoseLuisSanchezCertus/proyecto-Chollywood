<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Películas</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">
    <h1>Películas Disponibles</h1>
    <table class="table table-striped mt-3">
        <thead>
            <tr>
                <th>Pelicula</th>
                <th>Título</th>
                <th>Género</th>
                <th>Duración</th>
                <th>Clasificación</th>
                <th>Sinopsis</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="pelicula : ${peliculas}">
             	<td>
  				<img th:src="@{/imagen/{img} (img=${pelicula.imagen})}" width="136" height="136" >
				</td>  
                <td th:text="${pelicula.titulo}">Título</td>
                <td th:text="${pelicula.genero}">Género</td>
                <td th:text="${pelicula.duracion}">120</td>
                <td th:text="${pelicula.clasificacion}">PG-13</td>
                <td th:text="${pelicula.sinopsis}">Sinopsis breve...</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
