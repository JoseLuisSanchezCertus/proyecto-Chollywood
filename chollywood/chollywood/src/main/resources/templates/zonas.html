<!DOCTYPE html>
<html xmlns:th=" http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Zonas</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
	<h1> Zonas del autocinema </h1>
	
    <table class="table table-striped mt-3">
        <thead>
            <tr>
                <th>Numero de zona</th>
                <th>Nombre</th>
                <th>Capacidad</th>
                <th>Precio Base</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="zona : ${zonas}">
                <td th:text="${zona.id}">1</td>
                <td th:text="${zona.nombre}">Zona A</td>
                <td th:text="${zona.capacidad}">50</td>
                <td th:text="${zona.precioBase}">15</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
